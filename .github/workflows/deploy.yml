name: Deploy Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      APP_URL: ${{ vars.APP_URL }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_USERNAME: ${{ vars.DB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate settings and prepare deployment files
        run: node deploy/prepare.mjs
      - name: Build and migrate before rollout
        run: |
          docker build -t chamados:deploy .
          docker run --rm --env-file .env.deploy --entrypoint php chamados:deploy artisan app:prepare-production-database
      - name: Publish Worker and container with secrets
        run: npx wrangler deploy --secrets-file .secrets.deploy.json
      - name: Clean secret files
        if: always()
        run: rm -f .env.deploy .secrets.deploy.json
